services:
  backend:
    build: .
    container_name: sentiment_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/sentiment_analyzer.db}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - hf_cache:/app/.cache/huggingface   # Modeller her yeniden başlatmada inmesin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s                      # İlk model indirmesi zaman alabilir
    restart: unless-stopped

  dashboard:
    build: .
    container_name: sentiment_dashboard
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_URL: http://backend:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  hf_cache:
